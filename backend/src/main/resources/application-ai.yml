spring:
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      init:
        timeout: 2m
        max-retries: 2
      chat:
        options:
          model: ${SPRING_AI_OLLAMA_CHAT_MODEL:llama3.2}
          temperature: 0.3
          num-predict: 256
          keep-alive: 10m
      embedding:
        options:
          model: ${SPRING_AI_OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

app:
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:true}
    provider: ollama
    reindex-on-startup: ${KNOWLEDGE_REINDEX_ON_STARTUP:true}
  ai:
    rag:
      top-k: 5
      embedding-dimension: 768
      similarity-threshold: 0.70
      fast-path-enabled: ${RAG_FAST_PATH_ENABLED:true}
      fast-path-min-similarity: ${RAG_FAST_PATH_MIN_SIMILARITY:0.85}
      hybrid-text-enabled: true
      exact-code-boost: 10.0
      code-not-found-enabled: true
      context:
        equipment-boost: 2.0
        family-boost: 1.6
        zone-boost: 1.8
        manufacturer-boost: 1.8
        symptom-boost: 1.5
        zone-mismatch-penalty: 0.6
      performance:
        embedding-timeout: 5s
        llm-timeout: 180s
        circuit-breaker-threshold: 5
        circuit-breaker-timeout: 30s
        thread-pool-core-size: 2
        thread-pool-max-size: 8
        thread-pool-queue-capacity: 100

# Avoid dumping prompts/embeddings via framework loggers; app code logs lengths only.
logging:
  level:
    org.springframework.ai: INFO
    org.springframework.ai.chat.client: INFO
