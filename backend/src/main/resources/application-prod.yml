spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    path: ${FILE_STORAGE_PATH:/data/documents}
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:false}
    provider: ${KNOWLEDGE_PROVIDER:ollama}

logging:
  level:
    root: INFO
    com.ocp.eia: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
