spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  cookie:
    secure: ${APP_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  storage:
    path: ${FILE_STORAGE_PATH:/data/documents}
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:false}
    provider: ${KNOWLEDGE_PROVIDER:ollama}

logging:
  level:
    root: INFO
    com.ocp.eia: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.security: WARN
    org.springframework.ai: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
