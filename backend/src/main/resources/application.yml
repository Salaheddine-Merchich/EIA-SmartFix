spring:
  application:
    name: eia-smartfix
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 32
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  servlet:
    context-path: /

app:
  jwt:
    # No default secret — set JWT_SECRET (dev profile may supply a local default)
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:86400000}
  cookie:
    secure: ${APP_COOKIE_SECURE:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  storage:
    path: ${FILE_STORAGE_PATH:./data/documents}
  knowledge:
    enabled: ${KNOWLEDGE_ENABLED:false}
    provider: ${KNOWLEDGE_PROVIDER:ollama}

springdoc:
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.ocp.eia: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: INFO
    org.springframework.ai: INFO
