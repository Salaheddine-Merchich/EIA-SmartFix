spring:
  datasource:
    url: jdbc:h2:mem:eia_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  autoconfigure:
    exclude:
      - org.springframework.ai.autoconfigure.ollama.OllamaAutoConfiguration

app:
  jwt:
    secret: test-secret-key-at-least-256-bits-long-for-jwt-signing-in-tests-only
    access-expiration-ms: 1800000
    refresh-expiration-ms: 604800000
  storage:
    path: ./target/test-documents
  knowledge:
    enabled: false
