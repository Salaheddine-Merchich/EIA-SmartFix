services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eia_smartfix}
      POSTGRES_USER: ${POSTGRES_USER:-eia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "15432:5432"  # 5433 souvent bloqué par Hyper-V sur Windows
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eia_user} -d ${POSTGRES_DB:-eia_smartfix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: eia-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/eia_smartfix}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-eia_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-1800000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/data/documents}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80}
      # Knowledge/RAG off unless AI profile is used (see ollama service + README)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
      KNOWLEDGE_PROVIDER: ${KNOWLEDGE_PROVIDER:-ollama}
    ports:
      - "8080:8080"
    volumes:
      - document_data:/data/documents

  frontend:
    build: ./frontend
    container_name: eia-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

  # Start with: docker compose --profile ai up -d
  # and set SPRING_PROFILES_ACTIVE=dev,ai KNOWLEDGE_ENABLED=true
  ollama:
    image: ollama/ollama:latest
    container_name: eia-ollama
    profiles:
      - ai
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  document_data:
  ollama_data:
