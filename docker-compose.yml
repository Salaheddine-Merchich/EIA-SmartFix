services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eia-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eia_smartfix}
      POSTGRES_USER: ${POSTGRES_USER:-eia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Bind localhost only — not LAN. Override for remote DB clients if needed.
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eia_user} -d ${POSTGRES_DB:-eia_smartfix}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: eia-backend
    depends_on:
      postgres:
        condition: service_healthy
      # When compose --profile ai is used, wait for Ollama before starting the API.
      ollama:
        condition: service_started
        required: false
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/eia_smartfix}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-eia_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Set SPRING_DATASOURCE_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (min 32 chars)}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-86400000}
      FILE_STORAGE_PATH: ${FILE_STORAGE_PATH:-/data/documents}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:80,http://127.0.0.1:80}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      # Default prod-safe. Local demo: copy docker-compose.override.example.yml → docker-compose.override.yml
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      KNOWLEDGE_ENABLED: ${KNOWLEDGE_ENABLED:-false}
      KNOWLEDGE_PROVIDER: ${KNOWLEDGE_PROVIDER:-ollama}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - document_data:/data/documents

  frontend:
    build: ./frontend
    container_name: eia-frontend
    depends_on:
      - backend
    ports:
      - "127.0.0.1:80:80"

  # Start with: docker compose --profile ai up -d
  # Ollama stays on the Docker network only (not published to the host).
  ollama:
    image: ollama/ollama:latest
    container_name: eia-ollama
    profiles:
      - ai
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  document_data:
  ollama_data:
