server {

    listen 80;

    server_name localhost;

    root /usr/share/nginx/html;

    index index.html;

    # Re-resolve Docker service names when upstream containers are recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;
    set $backend_port 8080;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location = /api/v1/ai/assist {
        proxy_pass http://$backend_host:$backend_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Must stay >= backend app.ai.rag.performance.llm-timeout (180s)
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }

    location /api/v1/ai/assist/stream {
        proxy_pass http://$backend_host:$backend_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        # Must stay ≥ backend app.ai.rag.performance.llm-timeout (180s)
        proxy_read_timeout 200s;
        chunked_transfer_encoding on;
    }

    location /api/v1/live/events {
        proxy_pass http://$backend_host:$backend_port$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://$backend_host:$backend_port$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

}
